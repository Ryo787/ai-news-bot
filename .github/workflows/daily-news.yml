name: Daily AI News Digest

on:
  # Allows manual testing from the Actions tab
  workflow_dispatch:

  # Runs once per day
  schedule:
    - cron: "0 6 * * *"

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:

      # Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the project's dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Check whether Gmail secrets are actually being passed.
      # This NEVER prints the secret values.
      - name: Check notification configuration
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          echo "GMAIL_ADDRESS set: $([ -n "$GMAIL_ADDRESS" ] && echo YES || echo NO)"
          echo "GMAIL_APP_PASSWORD set: $([ -n "$GMAIL_APP_PASSWORD" ] && echo YES || echo NO)"
          echo "EMAIL_TO set: $([ -n "$EMAIL_TO" ] && echo YES || echo NO)"

      # Run the AI News Bot
      - name: Run AI News Bot
        env:

          # LLM
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Email
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Other notification options
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_USERNAME: ${{ secrets.SLACK_USERNAME }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USERNAME: ${{ secrets.DISCORD_USERNAME }}
          DISCORD_AVATAR_URL: ${{ secrets.DISCORD_AVATAR_URL }}

          # Bot settings
          NOTIFICATION_METHODS: ${{ secrets.NOTIFICATION_METHODS }}
          AI_RESPONSE_LANGUAGE: ${{ secrets.AI_RESPONSE_LANGUAGE }}
          ENABLE_WEB_SEARCH: ${{ secrets.ENABLE_WEB_SEARCH }}

        run: python main.py
